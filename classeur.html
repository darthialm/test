:root{

*{box-sizing:border-box}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;

details.inner>summary{cursor:pointer;font-weight:700;color:var(--accent);padding:4px 0}
.quiz{display:flex;flex-direction:column;gap:10px;padding-top:6px}

.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

<script>
/* =========================================================
   CLASSEUR 5e — données de la période et moteur de planification
   (15 séances de 1h30 : mer. 4 nov. → jeu. 17 déc. 2026)
   Ordre : Proportionnalité → Angles → Fractions 2 → Divisibilité.
   Le moteur est celui du classeur 6e : les séances forment un « flux » de blocs minutés
   que les créneaux de la classe consomment dans l'ordre ; si un créneau est annulé ou
   pas fini, la suite se décale, et les temps d'exercices (blocs souples) se raccourcissent.
   ========================================================= */
const B = (m, y, t, o) => Object.assign({ m, y, t }, o || {});
// y : r = cours / oral · a = activité, jeu · e = exercices (souple) · v = évaluation · q = Plickers

const CH = {
  prop: { nom: 'Proportionnalité (partie 1)', n: 1, site: 'proportionnalite', poids: '2 semaines' },
  ang: { nom: 'Angles', n: 2, site: 'angles', poids: '1 semaine' },
  fr: { nom: 'Fractions (partie 2)', n: 3, site: 'fractions2', poids: '1,5 semaine' },
  div: { nom: 'Divisibilité', n: 4, site: 'divisibilite', poids: '1,5 semaine' },
};

/* pages du site (index.html) : [chapitre, page, libellé] */
const PAGES = {
  proportionnalite: { tableaux: 'Tableaux de proportionnalité', problemes: 'Problèmes', pourcentages: 'Pourcentages', echelles: 'Échelles, durées et vitesses' },
  angles: { triangles: 'Angles dans un triangle', parallelisme: 'Angles et parallèles' },
  fractions2: { denominateur: 'Même dénominateur', comparer: 'Comparer et encadrer', addsub: 'Additionner et soustraire' },
  divisibilite: { division: 'Division euclidienne', multiples: 'Multiples et diviseurs', criteres: 'Critères et nombres premiers' },
};

const SEANCES = [
  /* ============ PROPORTIONNALITÉ (2 semaines) ============ */

    cours: 'Partie 1, paragraphes 1 et 2', mat: 'calculatrice',
    prep: 'Imprimer pour chaque élève le cours « Proportionnalité » (élève) et la fiche d\'exercices, en recto-verso. Projeter la fiche à projeter, séance 1.',
    act: 'Thalès et l\'arbre',
    actD: '<p>Projeter « Thalès et la pyramide », puis l\'activité du cours : une perche de 1 m a une ombre de 0,8 m, l\'ombre d\'un arbre mesure 6 m ; quelle est sa hauteur ? Les élèves cherchent 3 minutes seuls, puis on construit le tableau ensemble : <b>la hauteur et l\'ombre sont proportionnelles</b>, l\'arbre mesure 6 : 0,8 = 7,5 m.</p>',
    b: [
      B(8, 'q', 'Plickers (début) : prérequis, multiplier et diviser, vitesse de 6e', { ed: 'Questions de rappel : multiplier, diviser, situations de proportionnalité vues en 6e.' }),
      B(12, 'a', 'Accroche « Thalès et la pyramide », activité « Mesurer un arbre avec son ombre »', { ed: 'Activité : mesurer la hauteur d\'un arbre grâce à son ombre (la méthode de Thalès).' }),
      B(20, 'r', 'Cours partie 1.1 : tableau de proportionnalité, coefficient, méthode « Reconnaître »', { ed: 'Cours : reconnaître un tableau de proportionnalité ; le coefficient de proportionnalité.' }),
      B(20, 'e', 'Exercices 1 à 3 (proportionnel ou pas, taxi)', { min: 10, ex: ['prop', 1, 3] }),
      B(15, 'r', 'Cours partie 1.2 : compléter un tableau (× coefficient, : coefficient)', { ed: 'Cours : compléter un tableau de proportionnalité.' }),

    actD: '<p>Situation projetée : « 4 places de cinéma coûtent 28 €. Combien coûtent 6 places ? » Quatre groupes, <b>une méthode imposée chacun</b> (consignes sur la fiche à projeter) : coefficient, multiplication (× 1,5), addition (4 + 2), passage à l\'unité. Chaque groupe présente au tableau ; la classe compare et dégage « Quelle méthode choisir ? ».</p>',

      B(8, 'r', 'Questions flash : × 1,5 ; × 0,25 ; : 0,5', { ed: 'Calcul mental : multiplier par 1,5 et par 0,25, diviser par 0,5.' }),
      B(15, 'a', 'Activité « Violette va au cinéma » : une méthode par groupe', { ed: 'Activité en groupes : quatre méthodes pour résoudre le même problème (« Violette va au cinéma »).' }),
      B(22, 'r', 'Cours partie 1.3 : les quatre méthodes, quelle méthode choisir, problèmes (carrelage, location)', { ed: 'Cours : résoudre un problème de proportionnalité (coefficient, multiplication, addition, passage à l\'unité).' }),
      B(17, 'e', 'Exercices 6 à 8 (marché, voiture, imprimante)', { min: 8, ex: ['prop', 6, 8] }),
      B(20, 'e', 'Exercice 9 en groupes : problème « Le goûter de la classe »', { min: 0, ex: ['prop', 9, 9], ed: 'Problème en groupes : préparer le goûter de la classe (exercice 9 de la fiche).' }),

      B(27, 'e', 'Exercices 10 à 14 (le 15 pour aller plus loin)', { min: 10, ex: ['prop', 10, 15], ed: 'Exercices 10 à 14 de la fiche d\'exercices (15 pour aller plus loin).' }),

    actD: '<p>Avec les mesures relevées à la maison, chaque élève utilise l\'échelle 1/50, calcule dans un tableau les dimensions du plan (on divise par 50), puis trace le plan à la règle sur papier quadrillé. Il indique l\'échelle et nomme les meubles. Ceux qui ont oublié leurs mesures prennent la chambre « type » de l\'exemple du cours.</p><p>Bilan : que se passe-t-il avec l\'échelle 1/10 ? avec 1/200 ?</p>',
    b: [
      B(8, 'r', 'Questions flash : 10 %, 25 %, 50 %, 75 % d\'un nombre', { ed: 'Calcul mental : pourcentages simples.' }),
      B(20, 'r', 'Cours partie 3.1 : échelles (appliquer, calculer, échelle graphique)', { ed: 'Cours : les échelles (calculer une longueur réelle, calculer une échelle).' }),
      B(32, 'a', 'Activité « Le plan de ma chambre » : calculs et tracé à l\'échelle 1/50', { min: 20, ed: 'Activité : tracer le plan de sa chambre à l\'échelle 1/50.' }),
      B(22, 'e', 'Exercices 16 à 19 (randonnée, appartement, échelles, carte au trésor)', { min: 6, ex: ['prop', 16, 19] }),
      B(8, 'q', 'Plickers (fin) : échelles', { ed: 'Questions-bilan sur les échelles.' }),
    ] },
  { id: 'N5', ch: 'prop', k: 'Proportionnalité · révisions et évaluation', t: 'Durées et distances, puis évaluation Proportionnalité',
    cours: 'Partie 3, paragraphe 2', mat: 'calculatrice',
    prep: 'Préparer l\'évaluation de Proportionnalité (Espace professeur → Contrôle sur papier, compétences du chapitre 4) et l\'imprimer.',

    b: [

   Emploi du temps et planification
   ========================================================= */
const PERIODE_DEF = { debut: '2026-11-02', fin: '2026-12-18', feries: ['2026-11-11'] };
let PERIODE = { ...PERIODE_DEF, feries: [...PERIODE_DEF.feries] };
const EDT_DEF = () => ({ hebdo: [{ j: 3, d: 90 }, { j: 4, d: 90 }], extra: { on: true, j: 4, d: 90, first: '2026-11-09', every: 3 } });

const JOURS = ['', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi'];
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pdate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
function lundi(s) { const d = typeof s === 'string' ? pdate(s) : new Date(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
const fmtJ = (s, o) => pdate(s).toLocaleDateString('fr-FR', o || { weekday: 'short', day: 'numeric', month: 'short' });
const fmtD = (m) => (m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? pad(m % 60) : '') : m + ' min');

function creneaux(edt) {
  const out = [];
  if (!edt) return out;
  const d0 = lundi(PERIODE.debut), fin = pdate(PERIODE.fin);
  const x = edt.extra && edt.extra.on ? edt.extra : null;
  const x0 = x ? lundi(x.first || PERIODE.debut) : null;
  for (let d = new Date(d0); d <= fin; d.setDate(d.getDate() + 1)) {
    const s = iso(d);
    if (s < PERIODE.debut || PERIODE.feries.includes(s)) continue;
    const j = (d.getDay() + 6) % 7 + 1; // 1 = lundi
    const here = [];
    (edt.hebdo || []).forEach((h) => { if (+h.j === j) here.push(+h.d); });
    const nb = here.length;
    if (x && +x.j === j) { const w = Math.round((lundi(s) - x0) / (7 * 864e5)); if (w >= 0 && w % (+x.every || 3) === 0) here.push(+x.d); }
    here.forEach((m, i) => out.push({ id: s + (i ? '#' + i : ''), date: s, j, d: m, extra: i >= nb }));
  }
  return out;
}

function unites() {
  const u = [];
  for (const s of SEANCES) s.b.forEach((b, i) => u.push({ sid: s.id, i, m: b.m, y: b.y, t: b.t, ch: b.ch || s.ch, g: b.g || s.k, min: b.min == null ? (b.y === 'e' ? Math.min(10, b.m) : b.m) : b.min }));
  return u;
}
const droppable = (u) => u.min === 0;

/** réduit les blocs souples (type e) de R minutes, par pas de 5, depuis la fin (sens = -1) ou depuis le début (sens = 1) */
function reduire(us, from, R, sens) {
  const el = us.map((u, k) => k).filter((k) => k >= from && us[k].y === 'e' && us[k].min < us[k].m);
  if (sens === 1) el.reverse();
  const dur = us.map((u) => u.m);
  let r = R, guard = 0;
  while (r > 0 && guard++ < 500) {
    let moved = false;
    for (let a = el.length - 1; a >= 0 && r > 0; a--) { const k = el[a]; if (dur[k] - 5 >= us[k].min) { dur[k] -= 5; r -= 5; moved = true; } }
    if (!moved) break;
  }
  return { dur, ok: r <= 0 };
}

/** remplit les créneaux (cap = minutes disponibles) avec le flux de blocs ; un bloc non souple n'est jamais coupé */
function simuler(cr, us, dur, etat) {
  let k = etat.k, used = etat.used;
  const res = [];
  for (const c of cr) {
    let rem = c.cap, t = 0;
    const pieces = [];
    while (rem > 0 && k < us.length) {
      const u = us[k], left = dur[k] - used;
      if (left <= 0) { k++; used = 0; continue; }
      if (u.y !== 'e' && left > rem) break;
      const take = Math.min(left, rem);
      pieces.push({ sid: u.sid, i: u.i, t0: t, m: take, y: u.y, suite: used > 0, coupe: take < left });
      t += take; rem -= take; used += take;
      if (used >= dur[k]) { k++; used = 0; }
    }
    if (rem > 0 && k < us.length) {
      // rend le temps libre aux blocs souples raccourcis de ce créneau
      for (let a = pieces.length - 1; a >= 0 && rem > 0; a--) {
        const pv = pieces[a];
        if (pv.y === 'e' && !pv.coupe && !pv.suite) {
          const add = Math.min(rem, Math.max(0, us.find((z) => z.sid === pv.sid && z.i === pv.i).m - pv.m));
          pv.m += add; rem -= add;
        }
      }
      let tt = 0; pieces.forEach((q) => { q.t0 = tt; tt += q.m; }); t = tt;
      if (rem > 0) pieces.push({ marge: true, t0: t, m: rem });
    }
    res.push({ pieces, fin: { k, used } });
  }
  return { res, fin: { k, used }, reste: k < us.length };
}

function planifier(cr, us, depart) {
  // plus petite réduction des blocs souples qui fait tout rentrer (les blocs « facultatifs », min 0, peuvent sauter)
  const tient = (sim) => !sim.reste || !us.slice(sim.fin.k).some((u) => !droppable(u));
  let secours = null;
  for (let R = 0; R <= 900; R += 5) {
    let fin = true;
    for (const sens of [-1, 1]) {
      const { dur, ok } = reduire(us, depart.k, R, sens);
      const sim = simuler(cr, us, dur, depart);
      if (tient(sim)) return { ...sim, R, dur };
      if (ok) fin = false;
      if (!secours || sim.fin.k > secours.fin.k) secours = { ...sim, R, dur };
    }
    if (fin) break;
  }
  return secours;
}

function lastUnitIndex(us) { const r = {}; us.forEach((u, k) => { r[u.sid] = k; }); return r; }

/** plan complet d'une classe : créneaux déjà passés figés (fait / pas tout fini / annulé), créneaux à venir planifiés */
function planClasse(c) {
  const cr = creneaux(c.edt), us = unites(), st = c.cren || {};
  let L = -1;
  cr.forEach((x, i) => { if (st[x.id] && st[x.id].st) L = i; });
  const out = [];
  let cur = { k: 0, used: 0 }, last = null;
  const capOf = (x) => { const s = st[x.id] || {}; if (s.st === 'annule') return 0; if (s.st === 'partiel') return Math.max(0, x.d - (+s.reste || 0)); return x.d; };
  for (let i = 0; i < cr.length; i++) {
    if (i <= L) {
      const rest = cr.slice(i).map((x, j) => ({ ...x, cap: j === 0 ? capOf(x) : x.d }));
      const p = planifier(rest, us, cur);
      out.push({ ...cr[i], cap: rest[0].cap, ...p.res[0], st: (st[cr[i].id] || {}).st || 'fait', reste: (st[cr[i].id] || {}).reste || 0, fige: true });
      cur = p.res[0].fin;
    } else {
      const rest = cr.slice(i).map((x) => ({ ...x, cap: capOf(x) }));
      last = planifier(rest, us, cur);
      last.res.forEach((r, j) => out.push({ ...rest[j], ...r, st: (st[rest[j].id] || {}).st || '', reste: 0 }));
      cur = last.fin;
      break;
    }
  }
  const lu = lastUnitIndex(us);
  const fige = L >= 0 ? out[L].fin : { k: 0, used: 0 };
  const manque = cur.k < us.length ? us.slice(cur.k).filter((u) => !droppable(u)) : [];
  return { cr: out, us, lu, fige, manque, R: last ? last.R : 0, fin: cur };
}

/* ---------- devoirs : donnés le jeudi (dernier créneau de la journée), à rendre la semaine suivante ---------- */
function devoirsPlan(P) {
  const res = {};
  const lastOfDay = (i) => !P.cr[i + 1] || P.cr[i + 1].date !== P.cr[i].date;
  SEANCES.forEach((s) => {
    if (!DEV[s.id]) return;
    const end = P.cr.findIndex((z) => z.fin.k > P.lu[s.id]);
    if (end < 0) { res[s.id] = { give: -1, due: -1 }; return; }
    let g = -1;
    for (let i = end; i < P.cr.length; i++) { if (P.cr[i].j === 4 && P.cr[i].cap > 0 && lastOfDay(i)) { g = i; break; } }
    let due = -1;
    if (g >= 0) { const w = iso(lundi(P.cr[g].date)); due = P.cr.findIndex((z, i) => i > g && z.cap > 0 && iso(lundi(z.date)) > w); }
    res[s.id] = { give: g, due };
  });
  return res;
}

/* ---------- repères ---------- */
const labPiece = (sid, i) => { const s = SEANCES.find((x) => x.id === sid); return s.b[i].g || s.k; };
function resumeCreneau(x) {
  const seen = [];
  x.pieces.filter((p) => !p.marge).forEach((p) => { const l = labPiece(p.sid, p.i); if (!seen.includes(l)) seen.push(l); });
  return seen.join(' → ') || (x.cap === 0 ? 'Annulé' : '—');
}
function coupe(P) {
  let nom = 0, fait = 0;
  P.us.forEach((u, k) => { if (k < P.fin.k && !droppable(u)) nom += u.m; });
  P.cr.forEach((x) => x.pieces.forEach((p) => { if (!p.marge) { const k = P.us.findIndex((u) => u.sid === p.sid && u.i === p.i); if (k < P.fin.k && !droppable(P.us[k])) fait += p.m; } }));
  return Math.max(0, nom - fait);
}
/** avancement d'un chapitre : minutes de contenu (hors Plickers) dont le créneau est passé, début et fin prévus */
function chapitres(P) {
  const info = {};
  Object.keys(CH).forEach((id) => { info[id] = { id, total: 0, fait: 0, d0: null, d1: null, ev: null }; });
  P.us.forEach((u, k) => { if (u.y === 'q' || droppable(u)) return; const c = info[u.ch]; c.total += u.m; if (k < P.fige.k) c.fait += u.m; });
  P.cr.forEach((x) => x.pieces.forEach((p) => {
    if (p.marge) return;
    const u = P.us.find((z) => z.sid === p.sid && z.i === p.i), c = info[u.ch];
    if (u.y === 'q') return;
    if (!c.d0 || x.date < c.d0) c.d0 = x.date;
    if (!c.d1 || x.date > c.d1) c.d1 = x.date;
    if (u.y === 'v') c.ev = x.date;
  }));
  return Object.values(info);
}

    L.push(['📘 Cours complété (prof)', pdfHref(`cours-prof-${n}.pdf`, cp.prof['seance:' + sid]), 1]);
  }
  const ex = s.b.map((b) => b.ex).filter(Boolean);
  ex.forEach((e) => {
    const en = DOCN[e[0]], ep = PDFP.exo[en] || {};
    if (!ep.eleve) return;
    const lab = e[1] === e[2] ? `exercice ${e[1]}` : `exercices ${e[1]} ${e[2] === e[1] + 1 ? 'et' : 'à'} ${e[2]}`;
    L.push([`✏️ Fiche d'exercices (${lab})`, pdfHref(`exercices-${en}.pdf`, ep.eleve['exo:' + e[1]]), 0]);
    L.push([`✅ Corrigés (${lab})`, pdfHref(`exercices-corriges-${en}.pdf`, ep.prof['exo:' + e[1]]), 1]);
  });
  Object.keys(PDFP.proj).forEach((pn) => { const pg = PDFP.proj[pn]['seance:' + sid]; if (pg) L.push([`🖥️ Projeter (${pn === n ? 'séance' : pn.replace('Proportionnalite', 'Proportionnalité').replace('Divisibilite', 'Divisibilité')})`, pdfHref(`projection-${pn}.pdf`, pg), 1]); });
  const seen = new Set();
  return L.filter((l) => !seen.has(l[1]) && seen.add(l[1]));
}

</script>
<script>
/* =========================================================
   CLASSEUR 5e — interface
   ========================================================= */
const STORE_KEY = 'revisions5e-classeur';
const UI_KEY = 'revisions5e-classeur-ui';
let data = { classes: [], periode: null };
let ui = { cls: null, tab: 'creneaux', openC: null, manage: false, confirmDel: false };
try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY) || '{}')); ui.manage = false; ui.confirmDel = false; } catch (e) { /* rien */ }
let timer = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const siteBase = () => new URL('./', location.href).href;
const fmtLong = (s) => fmtJ(s, { weekday: 'long', day: 'numeric', month: 'long' });
function saveUi() { try { localStorage.setItem(UI_KEY, JSON.stringify({ cls: ui.cls, tab: ui.tab, openC: ui.openC })); } catch (e) { /* rien */ } }
function setStatus(t) { $('#status').textContent = t; }
function cur() { return data.classes.find((c) => c.id === ui.cls) || data.classes[0] || null; }

function norm(d) {
  if (!d || !Array.isArray(d.classes)) return { classes: [], periode: null };
  d.classes.forEach((c) => { c.cren = c.cren || {}; if (!c.edt) c.edt = EDT_DEF(); });
  if (d.periode && d.periode.debut && d.periode.fin) d.periode.feries = d.periode.feries || [];
  else d.periode = null;
  return d;
}
function applyPeriode() {
  PERIODE = data.periode ? { debut: data.periode.debut, fin: data.periode.fin, feries: [...data.periode.feries] } : { ...PERIODE_DEF, feries: [...PERIODE_DEF.feries] };
}

/* ---------- enregistrement (sur cet appareil) ---------- */
function persist() { clearTimeout(timer); setStatus('Enregistrement…'); timer = setTimeout(flush, 300); }
function flush() {
  timer = null;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data, (k, v) => (k === '_plan' ? undefined : v))); setStatus('Enregistré sur cet appareil.'); }
  catch (e) { setStatus('⚠ Pas enregistré : le navigateur refuse (navigation privée ?). Fais une sauvegarde dans un fichier.'); }
}
function loadLocal() { try { const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); if (d && Array.isArray(d.classes)) data = norm(d); } catch (e) { /* rien */ } applyPeriode(); }

const plan = (c) => c._plan || (c._plan = planClasse(c));
const invalider = (c) => { if (c) delete c._plan; };

/* ---------- copie ---------- */
async function copyText(text, btn, html) {
  let ok = false;
  try {
    if (html && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
      ok = true;
    }
  } catch (e) { /* on essaie autrement */ }
  if (!ok) { try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* idem */ } }
  if (!ok) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
  }
  if (btn) {
    const old = btn.dataset.lab || btn.textContent;
    btn.dataset.lab = old;
    btn.textContent = ok ? 'Copié ✓' : 'Copie refusée';
    setTimeout(() => { btn.textContent = old; }, 1400);
  }
  if (!ok) setStatus('La copie automatique est refusée par le navigateur : sélectionne le texte et copie-le avec le menu.');
}

/* ---------- Plickers ---------- */
function quizText(sid) {
  const Q = QUIZ[sid], s = SEANCES.find((x) => x.id === sid);
  return `Plickers · ${s.k} · ${Q.titre} (${Q.quand} de séance)\n\n` + Q.q.map((q, i) => `${i + 1}. ${q[0]}\n` + q[1].map((o, j) => `${LET[j]}. ${o}`).join('\n') + `\nBonne réponse : ${LET[q[2]]}`).join('\n\n');
}
function quizCsv(sids) {
  const rows = [['Séance', 'Question', 'A', 'B', 'C', 'D', 'Bonne réponse']];
  sids.forEach((sid) => QUIZ[sid].q.forEach((q) => rows.push([sid, q[0], q[1][0] || '', q[1][1] || '', q[1][2] || '', q[1][3] || '', LET[q[2]]])));
  return '﻿' + rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function quizHtml(sid) {
  const Q = QUIZ[sid];
  return `<div class="quiz">
    <div class="row"><button class="btn primary small" data-copyset="${sid}">Copier les 5 questions</button>
    <button class="btn small" data-csv="${sid}">Télécharger en CSV</button>
    <span class="hint">Dans Plickers : une question à la fois ; les boutons A à D copient chaque réponse. La bonne réponse (✔) est à cocher dans Plickers.</span></div>
    ${Q.q.map((q, i) => `<div class="qz"><div class="qline"><span class="qn">${i + 1}</span><span class="qt">${esc(q[0])}</span><button class="mini" data-cq="${sid}:${i}:q" title="Copier la question">Copier</button></div>
      <ul class="qopts">${q[1].map((o, j) => `<li class="${j === q[2] ? 'good' : ''}"><b>${LET[j]}</b> <span>${esc(o)}</span>${j === q[2] ? ' <span class="chk" title="Bonne réponse">✔</span>' : ''} <button class="mini" data-cq="${sid}:${i}:${j}" title="Copier la réponse ${LET[j]}">Copier</button></li>`).join('')}</ul></div>`).join('')}
  </div>`;
}
function copyQ(spec, btn) {
  const [sid, i, f] = spec.split(':'); const q = QUIZ[sid].q[+i];
  copyText(f === 'q' ? q[0] : q[1][+f], btn);
}

/* ---------- devoirs ---------- */
function siteLinks(sid) {
  const d = DEV[sid]; if (!d.site || !d.site.length) return '';
  return `<p>Pour s'entraîner sur le site : ${d.site.map(([ch, p]) => `<a href="${esc(siteBase() + '#/' + ch + '/' + p)}">${esc(PAGES[ch][p])}</a>`).join(' · ')}</p>`;
}
function dueText(P, e) {
  if (!e || e.give < 0) return '';
  if (e.due >= 0) return `<p><b>À rendre pour le ${esc(fmtLong(P.cr[e.due].date))}.</b></p>`;
  return '<p><b>À rendre à la rentrée.</b></p>';
}
function devoirHtml(sid, P, e) { return DEV[sid].h + siteLinks(sid) + dueText(P, e); }
function devoirPlain(html) { const t = document.createElement('div'); t.innerHTML = html; return [...t.querySelectorAll('p')].map((p) => p.textContent).join('\n'); }

/* ---------- École Directe : textes à copier ---------- */
const exTxt = (e) => (e[1] === e[2] ? `Exercice ${e[1]} de la fiche d'exercices.` : `Exercices ${e[1]} ${e[2] === e[1] + 1 ? 'et' : 'à'} ${e[2]} de la fiche d'exercices.`);
function edContenu(x) {
  const parts = x.pieces.filter((p) => !p.marge && p.y !== 'q');
  const lines = []; let cch = null;
  parts.forEach((p) => {
    const s = SEANCES.find((q) => q.id === p.sid), b = s.b[p.i], ch = b.ch || s.ch;
    if (ch !== cch) { if (lines.length) lines.push(''); lines.push(CHED[ch]); cch = ch; }
    let t = b.ed || (b.ex ? exTxt(b.ex) : b.t);
    if (p.coupe) t = t.replace(/\.$/, '') + ' (commencé, suite à la prochaine séance).';
    else if (p.suite) t = t.replace(/\.$/, '') + ' (suite et fin).';
    if (!lines.includes('- ' + t)) lines.push('- ' + t);
  });
  return lines.join('\n');
}
function devPlainLines(sid) { const t = document.createElement('div'); t.innerHTML = DEV[sid].h; return [...t.querySelectorAll('p')].map((p) => p.textContent.trim()); }
function siteLine(sid) {
  const d = DEV[sid]; if (!d.site || !d.site.length) return '';
  return `Pour s'entraîner (facultatif) : site Révisions 5e (${siteBase()}), ${d.site.length > 1 ? 'pages' : 'page'} ${d.site.map(([ch, p]) => `« ${PAGES[ch][p]} »`).join(', ')}.`;
}
function edTravail(P, i, gives, D) {
  const out = [];
  gives.forEach((s) => {
    const e = D[s.id];
    out.push(e.due >= 0 ? `Pour le ${fmtLong(P.cr[e.due].date)} :` : 'Pour la rentrée :');
    devPlainLines(s.id).forEach((l) => out.push('- ' + l));
    const sl = siteLine(s.id); if (sl) out.push(sl);
  });
  const ap = apporter(P, i);
  if (ap) { const t = document.createElement('div'); t.innerHTML = ap; if (out.length) out.push(''); out.push(t.textContent.trim()); }
  return out.join('\n');
}
function edBox(x, P, i, gives, D) {
  const c = edContenu(x), w = edTravail(P, i, gives, D);
  return `<div class="box ed"><h3>École Directe <span class="hint">(texte prêt à coller)</span></h3><div class="edgrid">
    <div><b>Contenu de séance</b><pre class="edtxt" id="edc-${x.id}">${esc(c || '—')}</pre><button class="btn small" data-copyed="edc-${x.id}">Copier le contenu</button></div>
    <div><b>Travail à faire</b>${w ? `<pre class="edtxt" id="edw-${x.id}">${esc(w)}</pre><button class="btn small" data-copyed="edw-${x.id}">Copier le travail à faire</button>` : '<p class="hint">Rien à noter dans « Travail à faire » pour ce créneau (les devoirs sont donnés le jeudi, en fin de journée).</p>'}</div>
  </div></div>`;
}
function devDocs(sid) {
  const n = DEV[sid].n; if (!n) return '';
  return `<a class="btn mini" href="devoirs-impression.pdf#page=${n}" target="_blank" rel="noopener">🖨️ Fiche « ${esc(DEV[sid].fiche)} » (2 par page)</a><a class="btn mini prof" href="devoirs-corriges.pdf#page=${2 * n}" target="_blank" rel="noopener">✅ Corrigé</a>`;
}

/* ---------- affichage : créneaux ---------- */
function prochainCreneau(P) { const today = iso(new Date()); return P.cr.find((x) => !x.st && x.date >= today) || P.cr.find((x) => !x.st) || null; }

function apporter(P, i) {
  if (P.cr[i + 1] && P.cr[i + 1].date === P.cr[i].date && P.cr[i + 1].cap > 0) return '';
  const nx = P.cr.slice(i + 1).find((z) => z.date !== P.cr[i].date && z.cap > 0 && z.pieces.some((p) => !p.marge));
  if (!nx) return '';
  const items = [];
  new Set(nx.pieces.filter((p) => !p.marge).map((p) => p.sid)).forEach((sid) => SEANCES.find((s) => s.id === sid).mat.split(', ').forEach((m) => { if (!items.includes(m)) items.push(m); }));
  return items.length ? `<p><b>Pour le ${esc(fmtLong(nx.date))}, apporter : ${esc(items.join(', '))}.</b></p>` : '';
}

function renderCreneaux(c) {
  const P = plan(c), D = devoirsPlan(P);
  const nfait = P.cr.filter((x) => x.st).length, nx = prochainCreneau(P);
  let h = `<div class="panel"><div class="progress"><h2>${nfait} créneau${nfait > 1 ? 'x' : ''} passé${nfait > 1 ? 's' : ''} sur ${P.cr.length}</h2>
    <div class="meter" role="img" aria-label="${nfait} sur ${P.cr.length}"><i style="width:${Math.round(nfait / Math.max(1, P.cr.length) * 100)}%"></i></div></div>
    ${nx ? `<p class="now">Prochain créneau : <b>${esc(fmtLong(nx.date))}</b> (${fmtD(nx.d)}) · ${esc(resumeCreneau(nx))}</p>` : '<p class="now">Tous les créneaux de la période sont passés.</p>'}
    <p class="hint">Après chaque cours, indique « Fait », « Pas tout fini » ou « Annulé » : la suite se recalcule. Une évaluation n'est jamais coupée.${coupe(P) ? ` Pour tout faire tenir, les temps d'exercices sont raccourcis de ${fmtD(coupe(P))} au total.` : ''}</p>
    ${P.manque.length ? `<p class="warn">Ne tient plus avant les vacances : ${esc([...new Set(P.manque.map((u) => u.g))].join(', '))}. Raccourcis une activité, ajoute un créneau ou décale la fin de période.</p>` : ''}
  </div>`;
  let semaine = '';
  P.cr.forEach((x, i) => {
    const lu = iso(lundi(x.date));
    if (lu !== semaine) { if (semaine) h += '</div>'; semaine = lu; h += `<div class="chap"><h2>Semaine du ${esc(fmtJ(lu, { day: 'numeric', month: 'long' }))}</h2>`; }
    const evals = x.pieces.filter((p) => !p.marge && p.y === 'v');
    const quiz = x.pieces.filter((p) => !p.marge && p.y === 'q');
    const gives = SEANCES.filter((s) => DEV[s.id] && D[s.id] && D[s.id].give === i);
    const stLab = { fait: 'Fait', partiel: 'Pas tout fini', annule: 'Annulé' }[x.st];
    const tags = [x.st ? `<span class="tag ${x.st === 'annule' ? 'eval' : 'fait'}">${stLab}</span>` : '',
      x.extra ? '<span class="tag extra">Créneau en plus</span>' : '',
      ...evals.map(() => '<span class="tag eval">Évaluation</span>'),
      ...quiz.map((p) => `<span class="tag plk">Plickers ${QUIZ[p.sid].quand}</span>`),
      gives.length ? '<span class="tag dev">Devoir à donner</span>' : ''].join('');
    const open = ui.openC && P.cr.some((z) => z.id === ui.openC) ? ui.openC === x.id : (nx && nx.id === x.id);
    const sids = [...new Set(x.pieces.filter((p) => !p.marge).map((p) => p.sid))];
    const acts = sids.map((sid) => SEANCES.find((s) => s.id === sid)).filter((s) => s.act && x.pieces.some((p) => p.sid === s.id && p.y === 'a'));
    h += `<details class="seance${x.st ? ' done' : ''}" data-cid="${x.id}" ${open ? 'open' : ''}>
      <summary><span class="sid">${esc(fmtJ(x.date))}</span><span class="stitle">${esc(resumeCreneau(x))}<small>${esc(JOURS[x.j])} · ${fmtD(x.d)}</small></span>${tags}</summary>
      <div class="sbody">
        <div class="seg" role="group" aria-label="Ce créneau">
          ${[['', 'À venir'], ['fait', 'Fait'], ['partiel', 'Pas tout fini'], ['annule', 'Annulé']].map(([k, l]) => `<button data-cst="${k}" data-c="${x.id}" aria-pressed="${(x.st || '') === k}">${l}</button>`).join('')}
        </div>
        ${x.st === 'partiel' ? `<div class="row"><label for="reste-${x.id}">Temps qui n'a pas pu être fait</label>
          <select id="reste-${x.id}" data-reste="${x.id}">${[10, 15, 20, 30, 40, 45, 60, 90].filter((m) => m <= x.d).map((m) => `<option value="${m}" ${+x.reste === m ? 'selected' : ''}>${fmtD(m)}</option>`).join('')}</select>
          <span class="hint">Ce qui n'a pas été fait passe au créneau suivant.</span></div>` : ''}
        <div class="box"><h3>Déroulé minuté</h3>
          ${x.cap === 0 ? '<p class="hint">Créneau annulé : le contenu passe au créneau suivant.</p>' : `<ol class="deroule">${x.pieces.map((p) => {
    const t = `${p.t0}–${p.t0 + p.m}`;
    if (p.marge) return `<li><span class="tps">${t}</span><span><span class="lib">Temps libre</span> Exercices « pour aller plus loin » de la fiche, ou rattrapage</span></li>`;
    const s = SEANCES.find((q) => q.id === p.sid), b = s.b[p.i];
    const lab = p.y === 'q' ? '<span class="lib">Plickers</span>' : `<span class="lib">${esc(labPiece(p.sid, p.i))}</span>`;
    const txt = p.y === 'q' ? b.t.replace(/^Plickers \([^)]*\) : /, `5 questions (${QUIZ[p.sid].quand} de séance) : `) : b.t;
    return `<li class="y-${p.y}"><span class="tps">${t}</span><span>${lab} ${esc(txt)}${p.suite ? ' (suite)' : ''}${p.coupe ? ' (à finir au créneau suivant)' : ''}</span></li>`;
  }).join('')}
            ${x.st === 'partiel' && x.reste ? `<li><span class="tps">${x.d - x.reste}–${x.d}</span><span class="hint">Non fait : reporté au créneau suivant</span></li>` : ''}</ol>`}
        </div>
        <div class="sgrid">
          <div class="box"><h3>Repère et documents</h3>${sids.map((sid) => { const s = SEANCES.find((q) => q.id === sid); return `<div><b>${esc(s.k)}</b><br><span class="hint">${esc(s.t)} · cours : ${esc(s.cours)}</span><div class="docs">${docLinks(sid).map(([l, h, p]) => `<a class="btn mini${p ? ' prof' : ''}" href="${esc(h)}" target="_blank" rel="noopener">${esc(l)}</a>`).join('')}</div></div>`; }).join('') || '<p class="hint">—</p>'}</div>
          <div class="box"><h3>À préparer</h3>${sids.map((sid) => `<div class="hint">${esc(SEANCES.find((q) => q.id === sid).prep)}</div>`).join('') || '<p class="hint">—</p>'}</div>
        </div>
        ${x.cap > 0 ? edBox(x, P, i, gives, D) : ''}
        ${acts.map((s) => `<div class="box"><h3>Activité · ${esc(s.act)}</h3><div class="act">${s.actD}</div></div>`).join('')}
        ${quiz.map((p) => `<div class="box"><h3>Plickers · ${esc(QUIZ[p.sid].titre)} <span class="tag plk">${QUIZ[p.sid].quand} de séance</span></h3>
          <details class="inner"><summary>Voir les 5 questions</summary>${quizHtml(p.sid)}</details></div>`).join('')}
        ${gives.length ? `<div class="box"><h3>Devoir à donner en fin de créneau</h3>
          <div class="devoir" id="devc-${x.id}">${gives.map((s) => devoirHtml(s.id, P, D[s.id])).join('')}${apporter(P, i)}</div>
          <div class="row">${gives.filter((s) => DEV[s.id].fiche).map((s) => devDocs(s.id)).join('')}</div></div>` : (apporter(P, i) ? `<div class="box"><h3>Pas de devoir ce jour-là</h3><div class="devoir">${apporter(P, i)}</div><p class="hint">Les devoirs sont donnés le jeudi, à rendre la semaine suivante.</p></div>` : '')}
      </div></details>`;
  });
  if (semaine) h += '</div>';
  return h;
}

/* ---------- affichage : chapitres ---------- */
function renderChapitres(c) {
  const P = plan(c), info = chapitres(P);
  return info.map((ch) => {
    const C = CH[ch.id], pc = ch.total ? Math.round(ch.fait / ch.total * 100) : 0;
    const lignes = P.cr.filter((x) => x.pieces.some((p) => !p.marge && p.y !== 'q' && P.us.find((u) => u.sid === p.sid && u.i === p.i).ch === ch.id));
    return `<div class="panel chcard"><div class="progress"><h2>Chapitre ${C.n} · ${esc(C.nom)}</h2>
      <div class="meter" role="img" aria-label="${pc} %"><i style="width:${pc}%"></i></div><span class="hint">${pc} % fait</span></div>
      <p class="hint">Durée prévue par toi : ${esc(C.poids)} (3h30 par semaine). ${ch.d0 ? `Dans le planning : du <b>${esc(fmtJ(ch.d0, { weekday: 'long', day: 'numeric', month: 'long' }))}</b> au <b>${esc(fmtJ(ch.d1, { weekday: 'long', day: 'numeric', month: 'long' }))}</b>${ch.ev ? `, évaluation le <b>${esc(fmtJ(ch.ev, { weekday: 'long', day: 'numeric', month: 'long' }))}</b>` : ''}.` : 'Ne tient pas dans la période.'}</p>
      <ul class="lignes">${lignes.map((x) => `<li><span class="sid">${esc(fmtJ(x.date))}</span><span>${esc(x.pieces.filter((p) => !p.marge && p.y !== 'q' && P.us.find((u) => u.sid === p.sid && u.i === p.i).ch === ch.id).map((p) => SEANCES.find((s) => s.id === p.sid).b[p.i].t).filter((t, i, a) => a.indexOf(t) === i).slice(0, 3).join(' · '))}</span>${x.st ? `<span class="tag fait">${{ fait: 'Fait', partiel: 'Pas tout fini', annule: 'Annulé' }[x.st]}</span>` : ''}</li>`).join('')}</ul>
      <p><a class="btn small" href="index.html#/${C.site}/fiche" target="_blank" rel="noopener">Fiche du chapitre sur le site</a></p></div>`;
  }).join('');
}

/* ---------- affichage : Plickers ---------- */
function renderPlickers(c) {
  const P = plan(c);
  const date = (sid) => { const x = P.cr.find((z) => z.pieces.some((p) => !p.marge && p.sid === sid && p.y === 'q')); return x ? fmtJ(x.date) : 'hors période'; };
  return `<div class="panel"><h2>Questions Plickers</h2>
    <p class="hint">5 questions par séance, à 4 choix au plus et en texte seul pour se coller dans Plickers. Le mercredi, elles sont posées en début de séance (retour sur la séance précédente) ; le jeudi, en fin de séance (bilan du jour).</p>
    <div class="row"><button class="btn small" data-csv="all">Tout télécharger en CSV (75 questions)</button></div></div>`
    + SEANCES.map((s) => `<details class="seance" data-sid="${s.id}"><summary><span class="sid">${s.id}</span><span class="stitle">${esc(QUIZ[s.id].titre)}<small>${esc(s.k)} · ${QUIZ[s.id].quand} de séance</small></span><span class="tag plk">${esc(date(s.id))}</span></summary><div class="sbody">${quizHtml(s.id)}</div></details>`).join('');
}

/* ---------- affichage : devoirs ---------- */
function renderDevoirs(c) {
  const P = plan(c), D = devoirsPlan(P);
  return `<div class="panel"><h2>Devoirs de la période</h2>
    <p class="hint">Un devoir est donné <b>chaque jeudi</b> (au dernier créneau de la journée) et se rend <b>à la première séance de la semaine suivante</b>. Le mercredi, pas de devoir. Chaque devoir est une fiche à coller (un résumé à apprendre et des exercices à faire dans le cahier). Les fiches sont dans <a href="devoirs-impression.pdf" target="_blank" rel="noopener">devoirs-impression.pdf</a> (deux fiches identiques par feuille A4, à couper) ; les corrigés dans <a href="devoirs-corriges.pdf" target="_blank" rel="noopener">devoirs-corriges.pdf</a>.</p></div>`
    + SEANCES.filter((s) => DEV[s.id]).map((s) => {
      const e = D[s.id], g = e && e.give >= 0 ? P.cr[e.give] : null;
      return `<details class="seance" data-sid="${s.id}"><summary><span class="sid">${g ? esc(fmtJ(g.date)) : '—'}</span><span class="stitle">${esc(DEV[s.id].fiche || 'Vacances de Noël')}<small>${g ? `à rendre ${e.due >= 0 ? 'le ' + esc(fmtJ(P.cr[e.due].date)) : 'à la rentrée'}` : 'hors période'}${DEV[s.id].revise ? ' · révision avant évaluation' : ''}</small></span></summary>
        <div class="sbody"><div class="devoir" id="dev-${s.id}">${devoirHtml(s.id, P, e)}</div>
        <div class="row"><button class="btn primary small" data-copydevs="${s.id}">Copier pour École Directe</button>${DEV[s.id].fiche ? devDocs(s.id) : ''}</div></div></details>`;
    }).join('');
}

/* ---------- affichage : vue d'ensemble (imprimable) ---------- */
function renderApercu(c) {
  const P = plan(c), D = devoirsPlan(P);
  const rows = P.cr.map((x, i) => {
    const gives = SEANCES.filter((s) => DEV[s.id] && D[s.id] && D[s.id].give === i);
    const quiz = x.pieces.filter((p) => !p.marge && p.y === 'q').map((p) => `${QUIZ[p.sid].quand === 'début' ? 'début' : 'fin'} · ${QUIZ[p.sid].titre}`);
    const ev = x.pieces.some((p) => !p.marge && p.y === 'v');
    return `<tr class="${x.st ? 'dn' : ''}"><td>${esc(fmtJ(x.date))}${x.extra ? ' <small>(en plus)</small>' : ''}</td><td>${fmtD(x.d)}</td><td>${ev ? '<b>Éval.</b> ' : ''}${esc(resumeCreneau(x))}</td><td>${quiz.map(esc).join('<br>') || '—'}</td><td>${gives.length ? gives.map((s) => esc(DEV[s.id].fiche || 'Vacances') + (D[s.id].due >= 0 ? ` <small>(pour le ${esc(fmtJ(P.cr[D[s.id].due].date))})</small>` : ' <small>(rentrée)</small>')).join('<br>') : '—'}</td><td>${x.st ? { fait: 'Fait', partiel: 'Pas tout fini', annule: 'Annulé' }[x.st] : ''}</td></tr>`;
  }).join('');
  return `<div class="panel printable"><div class="row" style="justify-content:space-between"><h2>${esc(c.nom)} · progression de la période</h2><button class="btn small noprint" id="btnPrint">Imprimer</button></div>
    <div class="scroll"><table class="ov"><thead><tr><th>Date</th><th>Durée</th><th>Contenu</th><th>Plickers</th><th>Devoir donné</th><th>Suivi</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint">Du ${esc(fmtJ(PERIODE.debut, { day: 'numeric', month: 'long' }))} au ${esc(fmtJ(PERIODE.fin, { day: 'numeric', month: 'long' }))}${PERIODE.feries.length ? ', sans le ' + PERIODE.feries.map((d) => fmtJ(d, { day: 'numeric', month: 'long' })).join(', ') : ''}. Les chapitres : ${Object.values(CH).map((x) => x.nom + ' (' + x.poids + ')').join(', ')}.</p></div>`;
}

/* ---------- gestion de la classe ---------- */
function renderEdt(c) {
  const e = c.edt;
  const jsel = (v, a) => `<select ${a}>${[1, 2, 3, 4, 5].map((j) => `<option value="${j}" ${+v === j ? 'selected' : ''}>${JOURS[j]}</option>`).join('')}</select>`;
  const dsel = (v, a) => `<select ${a}>${[45, 55, 60, 90, 120].map((m) => `<option value="${m}" ${+v === m ? 'selected' : ''}>${fmtD(m)}</option>`).join('')}</select>`;
  const n = creneaux(e);
  return `<div class="edt"><h3>Emploi du temps de cette classe</h3>
    <div class="edtrows">${e.hebdo.map((h, i) => `<div class="row">Chaque semaine, le ${jsel(h.j, `data-hj="${i}" aria-label="Jour"`)} ${dsel(h.d, `data-hd="${i}" aria-label="Durée"`)} <button class="btn small" data-hdel="${i}" aria-label="Retirer ce créneau">Retirer</button></div>`).join('')}
      <div><button class="btn small" id="btnHadd">Ajouter un créneau par semaine</button></div>
      <div class="row"><label class="row" style="font-weight:400"><input type="checkbox" id="xOn" ${e.extra && e.extra.on ? 'checked' : ''}> Un créneau en plus toutes les</label>
        <select id="xEvery" aria-label="Nombre de semaines">${[2, 3, 4].map((k) => `<option ${+(e.extra || {}).every === k ? 'selected' : ''}>${k}</option>`).join('')}</select> semaines, le
        ${jsel((e.extra || {}).j, 'id="xJ" aria-label="Jour du créneau en plus"')} ${dsel((e.extra || {}).d, 'id="xD" aria-label="Durée du créneau en plus"')}
        , la première fois la semaine du <input type="date" id="xFirst" value="${esc((e.extra || {}).first || PERIODE.debut)}"></div>
      <p class="hint">${n.length} créneaux dans la période, ${fmtD(n.reduce((a, x) => a + x.d, 0))} en tout (le contenu prévu demande 15 créneaux de 1h30).</p></div></div>`;
}
function renderPeriode() {
  return `<div class="edt"><h3>Période (commune à toutes les classes)</h3>
    <div class="row"><label for="pDeb">Du</label><input type="date" id="pDeb" value="${esc(PERIODE.debut)}"> <label for="pFin">au</label><input type="date" id="pFin" value="${esc(PERIODE.fin)}"></div>
    <div class="row"><span>Jours sans cours :</span>${PERIODE.feries.map((d, i) => `<span class="tag">${esc(fmtJ(d, { weekday: 'short', day: 'numeric', month: 'short' }))} <button class="x" data-fdel="${i}" aria-label="Retirer ce jour">×</button></span>`).join('') || '<span class="hint">aucun</span>'}
      <input type="date" id="fNew" aria-label="Ajouter un jour sans cours"> <button class="btn small" id="btnFadd">Ajouter</button></div>
    <p class="hint">Change ces dates pour planifier une autre période : les chapitres et leurs durées restent ceux de cette période.</p></div>`;
}
function renderManage() {
  const m = $('#manage'), c = cur();
  m.hidden = !(ui.manage && c); if (m.hidden) return;
  m.innerHTML = `<h2>Gérer ma progression</h2>
    <div><label for="fNom">Nom de la classe</label><input type="text" id="fNom" value="${esc(c.nom)}"></div>
    ${renderEdt(c)}${renderPeriode()}
    <div class="row"><button class="btn primary" id="btnSaveClass">Enregistrer</button>
    <button class="btn" id="btnAddClass">Ajouter une autre classe (mêmes horaires)</button>
    <button class="btn" id="btnResetSuivi">Effacer le suivi (fait / annulé)</button>
    <button class="btn danger" id="btnDel">Supprimer la classe</button></div>
    ${ui.confirmDel ? `<div class="confirm"><span>Supprimer « ${esc(c.nom)} » et son suivi ?</span><button class="btn danger" id="btnDelYes">Oui, supprimer</button><button class="btn" id="btnDelNo">Annuler</button></div>` : ''}`;
}
function renderBar() {
  $('#classBar').innerHTML = data.classes.map((c) => `<button class="chip" data-cls="${c.id}" aria-pressed="${cur() && cur().id === c.id}">${esc(c.nom)}</button>`).join('')
    + (data.classes.length ? `<button class="btn" id="btnManage" aria-expanded="${ui.manage}">${ui.manage ? 'Fermer' : 'Gérer ma progression'}</button>` : '');
}
function renderTabs() {
  const c = cur();
  $('#tabs').hidden = !c;
  $('#tabs').innerHTML = [['creneaux', 'Par créneau'], ['chap', 'Par chapitre'], ['plk', 'Plickers'], ['dev', 'Devoirs'], ['apercu', 'Vue d\'ensemble']]
    .map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${ui.tab === k}">${l}</button>`).join('');
}
function emptyState() {
  return `<div class="panel empty"><h2>Commence par ta classe</h2>
    <p>Donne un nom à ta classe : le classeur calcule tout seul les 15 créneaux de la période (mercredi et jeudi, avec un créneau de plus un jeudi sur trois, sans le 11 novembre) et y place les séances, les Plickers et les devoirs. Tu pourras changer l'emploi du temps ensuite.</p>
    <div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;text-align:left">
      <div><label for="nNom">Nom de la classe</label><input type="text" id="nNom" placeholder="5e A"></div>
      <div class="row"><button class="btn primary" id="btnCreate">Créer la classe</button></div>
    </div></div>`;
}

function render() {
  const c = cur();
  if (c && ui.cls !== c.id) ui.cls = c.id;
  renderBar(); renderTabs(); renderManage();
  const main = $('#main');
  if (!c) { main.innerHTML = emptyState(); return; }
  main.innerHTML = ui.tab === 'chap' ? renderChapitres(c) : ui.tab === 'plk' ? renderPlickers(c) : ui.tab === 'dev' ? renderDevoirs(c) : ui.tab === 'apercu' ? renderApercu(c) : renderCreneaux(c);
}

/* ---------- actions ---------- */
function newClass(nom, edt) {
  const c = { id: uid(), nom: nom || 'Ma classe', edt: edt || EDT_DEF(), cren: {} };
  data.classes.push(c); ui.cls = c.id; saveUi(); persist(); render(); return c;
}
function readManage(c) {
  const nom = $('#fNom').value.trim(); if (nom) c.nom = nom;
  const e = c.edt;
  e.extra = e.extra || {};
  e.extra.on = $('#xOn').checked; e.extra.every = +$('#xEvery').value; e.extra.j = +$('#xJ').value; e.extra.d = +$('#xD').value; e.extra.first = $('#xFirst').value || PERIODE.debut;
  const deb = $('#pDeb').value, fin = $('#pFin').value;
  if (deb && fin && deb < fin) { data.periode = { debut: deb, fin, feries: [...PERIODE.feries] }; applyPeriode(); }
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, a'); if (!t) return;
  const c = cur();
  if (t.dataset.cls) { ui.cls = t.dataset.cls; saveUi(); render(); return; }
  if (t.dataset.tab) { ui.tab = t.dataset.tab; saveUi(); render(); return; }
  if (t.id === 'btnManage') { ui.manage = !ui.manage; ui.confirmDel = false; render(); return; }
  if (t.id === 'btnCreate') { newClass($('#nNom').value.trim() || '5e'); return; }
  if (t.id === 'btnPrint') { window.print(); return; }
  if (!c) return;
  if (t.dataset.cst !== undefined) {
    const id = t.dataset.c, k = t.dataset.cst;
    if (k) c.cren[id] = { st: k, reste: k === 'partiel' ? (c.cren[id] && c.cren[id].reste) || 30 : 0 }; else delete c.cren[id];
    ui.openC = id; invalider(c); saveUi(); persist(); render(); return;
  }
  if (t.dataset.copydev) {
    const el = document.getElementById('devc-' + t.dataset.copydev); copyText(devoirPlain(el.innerHTML), t, el.innerHTML); return;
  }
  if (t.dataset.copyed) { copyText(document.getElementById(t.dataset.copyed).textContent, t); return; }
  if (t.dataset.copydevs) {
    const sid = t.dataset.copydevs, P = plan(c), e = devoirsPlan(P)[sid] || { due: -1 };
    const lines = [e.due >= 0 ? `Pour le ${fmtLong(P.cr[e.due].date)} :` : 'Pour la rentrée :', ...devPlainLines(sid).map((l) => '- ' + l)];
    const sl = siteLine(sid); if (sl) lines.push(sl);
    copyText(lines.join('\n'), t); return;
  }
  if (t.dataset.copyset) { copyText(quizText(t.dataset.copyset), t); return; }
  if (t.dataset.cq) { copyQ(t.dataset.cq, t); return; }
  if (t.dataset.csv) {
    const sids = t.dataset.csv === 'all' ? SEANCES.map((s) => s.id) : [t.dataset.csv];
    download(t.dataset.csv === 'all' ? 'plickers_5e_periode2.csv' : `plickers_${t.dataset.csv}.csv`, quizCsv(sids), 'text/csv;charset=utf-8'); return;
  }
  if (t.id === 'btnHadd') { readManage(c); c.edt.hebdo.push({ j: 3, d: 90 }); invalider(c); persist(); render(); return; }
  if (t.dataset.hdel !== undefined) { readManage(c); c.edt.hebdo.splice(+t.dataset.hdel, 1); invalider(c); persist(); render(); return; }
  if (t.dataset.fdel !== undefined) { readManage(c); const p = data.periode || { debut: PERIODE.debut, fin: PERIODE.fin, feries: [...PERIODE.feries] }; p.feries.splice(+t.dataset.fdel, 1); data.periode = p; applyPeriode(); data.classes.forEach(invalider); persist(); render(); return; }
  if (t.id === 'btnFadd') {
    const v = $('#fNew').value; if (!v) return; readManage(c);
    const p = data.periode || { debut: PERIODE.debut, fin: PERIODE.fin, feries: [...PERIODE.feries] }; if (!p.feries.includes(v)) p.feries.push(v); p.feries.sort(); data.periode = p; applyPeriode(); data.classes.forEach(invalider); persist(); render(); return;
  }
  if (t.id === 'btnSaveClass') { readManage(c); data.classes.forEach(invalider); persist(); ui.manage = false; render(); return; }
  if (t.id === 'btnAddClass') { readManage(c); const n = newClass('Nouvelle classe', JSON.parse(JSON.stringify(c.edt))); ui.manage = true; render(); $('#fNom').focus(); $('#fNom').select(); return; }
  if (t.id === 'btnResetSuivi') { c.cren = {}; invalider(c); persist(); render(); return; }
  if (t.id === 'btnDel') { ui.confirmDel = true; render(); return; }
  if (t.id === 'btnDelNo') { ui.confirmDel = false; render(); return; }
  if (t.id === 'btnDelYes') { data.classes = data.classes.filter((x) => x.id !== c.id); ui.cls = data.classes[0] ? data.classes[0].id : null; ui.manage = false; ui.confirmDel = false; saveUi(); persist(); render(); return; }
});
document.addEventListener('change', (ev) => {
  const t = ev.target, c = cur(); if (!c) return;
  if (t.dataset.reste) { const e = c.cren[t.dataset.reste]; if (e) { e.reste = +t.value; invalider(c); persist(); render(); } return; }
  if (t.dataset.hj !== undefined) { c.edt.hebdo[+t.dataset.hj].j = +t.value; invalider(c); persist(); render(); return; }
  if (t.dataset.hd !== undefined) { c.edt.hebdo[+t.dataset.hd].d = +t.value; invalider(c); persist(); render(); return; }
  if (['xOn', 'xEvery', 'xJ', 'xD', 'xFirst', 'pDeb', 'pFin'].includes(t.id)) { readManage(c); data.classes.forEach(invalider); persist(); render(); }
});
document.addEventListener('toggle', (ev) => {
  const d = ev.target; if (d.tagName === 'DETAILS' && d.dataset.cid && d.open) { ui.openC = d.dataset.cid; saveUi(); }
}, true);

/* ---------- sauvegarde dans un fichier ---------- */
$('#btnExport').addEventListener('click', () => {
  download('classeur5e_sauvegarde.json', JSON.stringify(data, (k, v) => (k === '_plan' ? undefined : v), 1), 'application/json');
  setStatus('Sauvegarde téléchargée.');
});
$('#fileImport').addEventListener('change', async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.classes)) throw new Error('format');
    data = norm(d); applyPeriode(); ui.cls = data.classes[0] ? data.classes[0].id : null; persist(); render(); setStatus('Sauvegarde restaurée.');
  } catch (e) { setStatus('Ce fichier n\'est pas une sauvegarde du classeur.'); }
  ev.target.value = '';
});

loadLocal();
if (!data.classes.length) { /* l'écran « Commence par ta classe » s'affiche */ }
render();

</script>
</body>
</html>
